<!-- Componente de galeria-->

<!--barra inicial-->
<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
     Camara
    </ion-title>
  </ion-toolbar>
</ion-header>

<!--Boton de Camara-->
<ion-content  [fullscreen]="true">
  <ion-fab vertical="center" horizontal="center" slot="fixed">

    <ion-fab-button (click)="addNew_picture()"> 
      <ion-icon name="camera"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
